name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite

jobs:

  build-windows-vs:
    # CUDA 12.6 integrates with VS2022, while windows-latest may select the
    # unsupported Visual Studio 18 toolset.
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
        path: vcpkg

    - name: Bootstrap vcpkg
      shell: pwsh
      run: '& "$env:PROJECT_VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.35
      id: cuda-toolkit
      with:
        cuda: '12.6.0'
        method: 'network'
        sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

    - name: Initialize MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Ninja
      shell: pwsh
      run: choco install ninja --yes --no-progress

    - name: Configure CMake with Ninja and MSVC
      shell: pwsh
      run: |
        cmake --preset windows-vs-debug `
          -DCMAKE_CUDA_COMPILER="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc.exe" `
          -DCMAKE_TOOLCHAIN_FILE="$env:PROJECT_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCUDAToolkit_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"

    - name: Build with Ninja and MSVC
      run: cmake --build --preset windows-vs-debug

  build-linux-gcc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
        path: vcpkg

    - name: Bootstrap vcpkg
      run: "$PROJECT_VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics"

    - name: Install OpenGL, X11, and GTK dependencies
      run: |
        sudo apt update
        sudo apt install libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
        sudo apt install libgl-dev
        sudo apt install libgtk-3-dev
        sudo apt install autoconf autoconf-archive automake libtool

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.35
      id: cuda-toolkit
      with:
        cuda: '12.6.0'
        method: 'network'
        sub-packages: '["nvcc", "cudart"]'

    - name: Configure CMake with GCC (Debug)
      run: |
        cmake --preset linux-gcc-debug \
          -DCMAKE_CUDA_COMPILER="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc" \
          -DCMAKE_TOOLCHAIN_FILE="$PROJECT_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DCUDAToolkit_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"

    - name: Build with GCC (Debug)
      run: cmake --build --preset linux-gcc-debug
